[package]
name = "spotify_cmd"
version = "0.1.0"
edition = "2024"
description = "Cliente de Spotify para la terminal: reproducción, listas, buscador y carátula del álbum"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots"] }
rspotify = { version = "0.16", default-features = false, features = ["client-reqwest", "reqwest-rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
toml = "1"
url = "2"
webbrowser = "1"

# Reproductor local (librespot): spotify_cmd es también un dispositivo de
# Spotify Connect que suena en este equipo. En Linux necesita las cabeceras
# de ALSA para compilar (`sudo apt install libasound2-dev`); sin él:
# `cargo install --path . --no-default-features`.
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
librespot-playback = { version = "0.8", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots"], optional = true }
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
cpal = { version = "0.16", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["local-player"]
local-player = ["dep:librespot-core", "dep:librespot-playback", "dep:librespot-connect", "dep:cpal"]

[profile.release]
lto = "thin"
strip = true

